<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX 公式样式 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // ================= Docsify 配置 =================
    window.$docsify = {
      loadSidebar: true,
      name: '',
      repo: '',
      // 自定义 markdown 渲染器，用于支持 mermaid 图表
      markdown: {
        renderer: {
          code: function(code, lang) {
            // 如果代码块语言是 mermaid，输出一个带 mermaid 类的 div，由 mermaid 库渲染
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            // 其他语言的代码块保持默认处理
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    };
  </script>

  <!-- Docsify 核心 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- KaTeX 公式依赖 -->
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@3.0.8/lib/marked.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2/dist/docsify-katex.js"></script>

  <!-- Mermaid 核心库 -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- 稳定初始化 Mermaid，适配 Docsify 页面切换 -->
  <script>
    (function() {
      if (!window.mermaid) return;
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default'
      });
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
        hook.doneEach(function() {
          setTimeout(function() {
            if (typeof mermaid.run === 'function') {
              mermaid.run({ querySelector: '.mermaid' });
            } else {
              mermaid.init(undefined, document.querySelectorAll('.mermaid'));
            }
          }, 0);
        });
      });
    })();
  </script>
</body>
</html>
